# /etc/nginx/sites-available/crm.wishtune.com
# Then:  sudo ln -s /etc/nginx/sites-available/crm.wishtune.com /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# Uses the existing Let's Encrypt certificate. If certbot already wrote a
# server block for crm.wishtune.com, merge the two `location` sections below
# into it instead of adding a second server block.

server {
    listen 80;
    listen [::]:80;
    server_name crm.wishtune.com;
    return 301 https://$host$request_uri;   # HTTPS only
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.wishtune.com;

    ssl_certificate     /etc/letsencrypt/live/crm.wishtune.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.wishtune.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    # Backend: webhooks, the public sign-up endpoint and the admin API.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the Next.js admin app (all pages need a login).
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
