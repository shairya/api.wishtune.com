# Sandbox: devcrm.wishtune.com (frontend) + devapi.wishtune.com (API)
#
#   sudo cp deploy/nginx-dev.wishtune.com.conf /etc/nginx/sites-available/dev.wishtune.com.conf
#   sudo ln -s /etc/nginx/sites-available/dev.wishtune.com.conf /etc/nginx/sites-enabled/dev.wishtune.com.conf
#   sudo certbot certonly --nginx -d devcrm.wishtune.com -d devapi.wishtune.com   # if no certificate yet
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ports: sandbox API 5200, sandbox frontend 3200 (production uses 5100 / 3100).
# Both hosts are noindex. Optionally restrict the sandbox to your office IPs by
# uncommenting the allow/deny lines (keep them off devapi /webhooks/ if you test
# Netlify/Payhip test calls from outside).

server {
    listen 80;
    listen [::]:80;
    server_name devcrm.wishtune.com devapi.wishtune.com;
    return 301 https://$host$request_uri;
}

# ---- devcrm.wishtune.com → Next.js sandbox build ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devcrm.wishtune.com;

    ssl_certificate     /etc/letsencrypt/live/devcrm.wishtune.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devcrm.wishtune.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    # allow 203.0.113.10;   # office IP
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---- devapi.wishtune.com → sandbox API (whole host) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devapi.wishtune.com;

    # certbot puts both names in one certificate named after the first -d
    ssl_certificate     /etc/letsencrypt/live/devcrm.wishtune.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devcrm.wishtune.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
